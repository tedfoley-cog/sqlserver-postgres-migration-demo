# ============================================================================
# Vehicle Operations — Application Configuration
# ============================================================================
# Production: SQL Server on-premises
#   spring.datasource.url=jdbc:sqlserver://sqlprod01.corp.local:1433;databaseName=VehicleOps
#   spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
#   spring.datasource.username=${DB_USER}
#   spring.datasource.password=${DB_PASSWORD}
#
# Demo: H2 in-memory with SQL Server compatibility mode
# ============================================================================

spring.datasource.url=jdbc:h2:mem:vehicleops;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

server.port=8080

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
